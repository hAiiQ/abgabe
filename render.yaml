services:
  - type: web
    name: abgabenkonto
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_SETUP_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: abgabenkonto-db
          property: connectionString
databases:
  - name: abgabenkonto-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: abgabenkonto
    user: portal
    ipAllowList: []
